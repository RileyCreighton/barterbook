name: Deploy devnet demo (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-devnet
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:scan
      - run: npm test
      - run: npm run build
      - name: Prepare isolated deployment configuration
        run: node .github/scripts/deployment-config.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          SITE_URL: ${{ vars.SITE_URL }}
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          DEVNET_ASSETS_JSON: ${{ vars.DEVNET_ASSETS_JSON }}
          DEMO_PARTICIPANTS_JSON: ${{ vars.DEMO_PARTICIPANTS_JSON }}
          SETTLEMENT_ENABLED: ${{ vars.SETTLEMENT_ENABLED }}
          RPC_HISTORY_TRUSTED: ${{ vars.RPC_HISTORY_TRUSTED }}
          FALLBACK_HISTORY_TRUSTED: ${{ vars.FALLBACK_HISTORY_TRUSTED }}
          RPC_ADDRESS_HISTORY_TRUSTED: ${{ vars.RPC_ADDRESS_HISTORY_TRUSTED }}
          FALLBACK_ADDRESS_HISTORY_TRUSTED: ${{ vars.FALLBACK_ADDRESS_HISTORY_TRUSTED }}
      - name: Record database recovery bookmark
        run: npx wrangler d1 time-travel info barterbook-devnet --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Apply remote migrations, then publish reviewed build
        run: |
          npx wrangler d1 migrations apply barterbook-devnet --remote --config .wrangler/deploy.json
          npx wrangler deploy --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
